version = "1.0"

[defaults]
count = 10
# template = "${hexrc} ${leet1rc} ${leet1rc} ${leet1rc} ${leet1rc}${symbolrc}"
preset = "hex_leet4_sym"
format = "ruler"
ruler_interval = 3
wordlist = "/Users/andrew.burns/.local/share/xkp/words.db"

[providers.word]
min = 4
max = 50

[providers.fwword]
min = 4
max = 50

[providers.num]
min = 10
max = 99999

[providers.hex]
bytes = 4

[providers.char]
alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
len = 1

[providers.def]
hexrc = "${hex | upcase(chance=0.5)}"
leet1rc = "${wordrc | leet(type=extended, mode=first, chance=0.25)}"
leetrc = "${wordrc | leet(type=classic, chance=0.5, p=0.25)}"
symbol = "${char(len=1,alphabet='~!@#$%^&*()')}"
symbolrc = "${symbol | rand(p=0.5)}"
wordrc = "${word | tcase(chance=0.25) | upcase(chance=0.25)}"
non-space = "${char(len=1,alphabet='-_')}"

[presets]
default = "${hexrc} ${wordrc} ${wordrc} ${wordrc} ${wordrc}${symbolrc}"
apple = "${hexrc}${non-space}${wordrc}${non-space}${wordrc}${non-space}${wordrc}${non-space}${wordrc}${symbolrc}"
hex_leet4_sym = "${hexrc} ${leet1rc} ${leet1rc} ${leet1rc} ${leet1rc}${symbolrc}"
xkcd = "${wordrc} ${wordrc} ${wordrc} ${wordrc}"

[bootstrap]
allow_stemmed_imports = false
sources = ["/Users/andrew.burns/.local/share/hyph/", "/Users/andrew.burns/.local/share/wordlists/", "/Users/andrew.burns/.local/share/words/", "/Users/andrew.burns/.words/", "/usr/share/dict/", "/usr/share/dict/words", "/usr/share/dict/words.cap", "/usr/share/dict/upper", "/usr/share/dict/propernames", "/usr/share/dict/propers", "/usr/share/dict/propers/", "/usr/share/dict/wordlist/", "/usr/share/wordlists/", "/usr/share/seclists/Wordlists/", "/usr/share/seclists/"]
