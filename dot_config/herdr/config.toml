onboarding = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
[ui.toast]
delivery = "herdr"

[experimental]
# allow_nested = true

[theme]
name = "dracula"
auto_switch = false

[keys]
prefix = "ctrl+a"
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
# WezTerm maps ⌘⇧[ => F10
previous_tab = ["prefix+p", "f10"]
# WezTerm maps ⌘⇧] => F11
next_tab = ["prefix+n", "f11"]
last_pane = "prefix+;"

############################################################
### herdr-navigator
############################################################
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+'"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "jump to prevous workspace"
### END ####################################################
