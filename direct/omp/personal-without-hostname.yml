providers: 
  memoryModel: online
  maxInFlightRequests: 
    lm-studio: 1
    llama.cpp: 1
  streamFirstEventTimeoutSeconds: 3600
  streamIdleTimeoutSeconds: 3600
  webSearchOrder: 
    - brave
    - firecrawl
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme: 
  dark: dark-ember
  light: light-gruvbox
setupVersion: 1
terminal: 
  showProgress: true
display: 
  showTokenUsage: true
  cacheMissMarker: true
steeringMode: all
interruptMode: immediate
doubleEscapeAction: tree
memory: 
  backend: mnemopi
eval: 
  rb: true
vault: 
  enabled: true
github: 
  enabled: true
plan: 
  defaultOnStartup: false
exa: 
  enableWebsets: false
statusLine: 
  preset: custom
  leftSegments: 
    - pi
    - mode
    - model
    - path
    - git
    - pr
    - subagents
    - time_spent
  rightSegments: 
    - session_name
    - context_pct
    - cost
    - usage
    - session
    - time
    - collab
dev: 
  autoqaConsent: granted
defaultThinkingLevel: auto
cycleOrder: 
  - budget
  - smol
  - default
  - spark
  - plan
  - plan_budget
  - flash
  - deepseek
  - kimi
  - luna
  - sol
modelRoles: 
  tiny: deepseek/deepseek-v4-flash
  commit: deepseek/deepseek-v4-flash
  vision: openai-codex/gpt-5.6-terra
  advisor: kimi-code/k3:high
  default: openai-codex/gpt-5.6-terra:medium
  task: openai-codex/gpt-5.6-terra:auto
  smol: openrouter/openai/gpt-5.6-luna:low
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-terra:medium
  spark: openai-codex/gpt-5.3-codex-spark
  budget: zai/glm-5.2:high
  plan_budget: deepseek/deepseek-v4-pro:high
  designer: openai-codex/gpt-5.6-sol:medium
  kimi: kimi-code/k3:high
  flash: deepseek/deepseek-v4-flash:high
  deepseek: deepseek/deepseek-v4-pro:high
  local: llama.cpp/laguna-xs-2.1
  luna: openrouter/openai/gpt-5.6-luna
  sol: openai-codex/gpt-5.6-sol
task: 
  agentModelOverrides: 
    plan: gpt-5.6-sol
    sonic: gpt-5.6-luna
retry: 
  fallbackChains: 
    default: 
      - zai/glm-5.2:high
      - openai-codex/gpt-5.3-codex-spark
      - kimi-code/k3
    smol: 
      - deepseek/deepseek-v4-flash
    commit: 
      - deepseek/deepseek-v4-flash
    budget: 
      - kimi-code/k3
      - deepseek/deepseek-v4-pro
    slow: 
      - openai-codex/gpt-5.3-codex-spark
    advisor: 
      - zai/glm-5.2
hideThinkingBlock: false
mcp: 
  {}
autolearn: 
  enabled: true
mnemopi: 
  scoping: per-project-tagged
  embeddingVariant: en
  noEmbeddings: false
  llmMode: smol
magicKeywords: 
  ultrathink: false
startup: 
  showSplash: false
  changelogMode: summary
power: 
  sleepPrevention: idle
compaction: 
  strategy: context-full
  thresholdPercent: 70
  handoffSaveToDisk: true
  idleEnabled: true
personality: pragmatic