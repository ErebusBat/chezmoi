providers:
  memoryModel: online
  maxInFlightRequests:
    lm-studio: 1
    llama.cpp: 1
    unsloth: 1
  streamFirstEventTimeoutSeconds: 3600
  streamIdleTimeoutSeconds: 3600
  webSearchOrder:
    - brave
    - firecrawl
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme:
  dark: dark-gruvbox
  light: light-gruvbox
setupVersion: 2
terminal:
  showProgress: true
display:
  showTokenUsage: true
  cacheMissMarker: true
steeringMode: all
interruptMode: immediate
doubleEscapeAction: tree
memory:
  backend: mnemopi
eval:
  rb: true
vault:
  enabled: true
github:
  enabled: true
plan:
  defaultOnStartup: false
statusLine:
  preset: custom
  leftSegments:
    - pi
    - mode
    - model
    - path
    - git
    - pr
    - subagents
    - time_spent
  rightSegments:
    - session_name
    - context_pct
    - cost
    - session
    - time
    - collab
  transparent: true
  compactThinkingLevel: true
  segmentOptions:
    path:
      abbreviate: true
      maxLength: 60
      stripWorkPrefix: true
      workRoots:
        - ~/src/erebusbat
dev:
  autoqaConsent: granted
defaultThinkingLevel: auto
cycleOrder:
  - default
  - luna
  - terra
  - sol
  - spark
  - deepseek
  - kimi
modelRoles:
  tiny: openai-codex/gpt-5.6-luna:high
  commit: openai-codex/gpt-5.6-luna:low
  vision: openai-codex/gpt-5.6-terra
  advisor: openai-codex/gpt-5.6-sol
  default: openai-codex/gpt-5.6-luna:high
  task: openai-codex/gpt-5.6-terra:auto
  smol: openai-codex/gpt-5.6-luna:medium
  slow: openai-codex/gpt-5.6-sol
  plan: openai-codex/gpt-5.6-terra:high
  spark: openai-codex/gpt-5.3-codex-spark
  budget: zai/glm-5.2:high
  designer: openai-codex/gpt-5.6-sol:medium
  kimi: kimi-code/k3:high
  flash: deepseek/deepseek-v4-flash:high
  deepseek: deepseek/deepseek-v4-pro:high
  local: unsloth/llmfan46/gemma-4-26B-A4B-it-ultra-uncensored-heretic-GGUF
  luna: openai-codex/gpt-5.6-luna:high
  terra: openai-codex/gpt-5.6-terra:auto
  sol: openai-codex/gpt-5.6-sol:auto
task:
  agentModelOverrides:
    plan: gpt-5.6-sol
    sonic: gpt-5.6-luna
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-5.3-codex-spark
    budget:
      - kimi-code/k3
      - deepseek/deepseek-v4-pro
    slow:
      - openai-codex/gpt-5.3-codex-spark
hideThinkingBlock: true
mcp:
  {}
autolearn:
  enabled: true
mnemopi:
  scoping: per-project-tagged
  embeddingVariant: en
  noEmbeddings: false
  llmMode: smol
magicKeywords:
  ultrathink: false
startup:
  showSplash: false
  changelogMode: summary
power:
  sleepPrevention: idle
compaction:
  thresholdPercent: 70
  handoffSaveToDisk: true
  idleEnabled: true
  methodOrder:
    - remote
    - soft
personality: pragmatic
composer:
  shape: claude