providers:
  webSearchOrder:
    - brave
    - anthropic
    - firecrawl
    - gemini
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme:
  dark: dark-retro
  light: light
setupVersion: 2
defaultThinkingLevel: auto
modelRoles:
  default: github-copilot/gpt-5.6-terra:medium
  task: github-copilot/gpt-5.6-terra:auto
  smol: github-copilot/gpt-5.6-luna:medium
  tiny: github-copilot/gpt-5.6-luna:low
  commit: github-copilot/gpt-5.6-luna:medium
  slow: github-copilot/claude-fable-5.1:auto
  plan: github-copilot/gpt-5.6-sol:auto
  designer: github-copilot/gpt-5.6-sol:auto
  advisor: github-copilot/claude-fable-5.1:auto
  vision: github-copilot/gpt-5.6-luna:auto
cycleOrder:
  - plan
  - default
  - smol
  - task
plan:
  defaultOnStartup: false
display:
  showTokenUsage: true
  cacheMissMarker: true
steeringMode: all
interruptMode: immediate
doubleEscapeAction: tree
statusLine:
  preset: custom
  leftSegments:
    - mode
    - model
    - path
    - git
    - pr
    - subagents
    - time_spent
  rightSegments:
    - session_name
    - context_pct
    - cost
    - usage
    - session
    - time
    - collab
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  embeddingVariant: en
  noEmbeddings: false
  llmMode: smol
dev:
  autoqaConsent: granted
hideThinkingBlock: true
task:
  agentModelOverrides:
    designer: anthropic/claude-opus-5
    reviewer: anthropic/opus
    task: anthropic/opus:high
composer:
  shape: box