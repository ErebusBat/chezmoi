providers: 
  webSearchOrder: 
    - brave
    - anthropic
    - firecrawl
    - gemini
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme: 
  dark: dark-retro
  light: light
setupVersion: 1
defaultThinkingLevel: auto
modelRoles: 
  default: anthropic/claude-opus-5
  task: anthropic/claude-sonnet-5:high
  smol: anthropic/claude-sonnet-5:low
  tiny: anthropic/claude-haiku-4.5:medium
  commit: anthropic/claude-haiku-4.5
  slow: anthropic/claude-opus-5:xhigh
  plan: anthropic/claude-opus-5
  designer: anthropic/claude-opus-5:auto
  advisor: anthropic/claude-opus-5:auto
  vision: anthropic/claude-haiku-4.5:medium
cycleOrder: 
  - plan
  - default
  - smol
  - task
plan: 
  defaultOnStartup: false
display: 
  showTokenUsage: true
  cacheMissMarker: true
steeringMode: all
interruptMode: immediate
doubleEscapeAction: tree
statusLine: 
  preset: custom
  leftSegments: 
    - mode
    - model
    - path
    - git
    - pr
    - subagents
    - time_spent
  rightSegments: 
    - session_name
    - context_pct
    - cost
    - usage
    - session
    - time
    - collab
memory: 
  backend: mnemopi
mnemopi: 
  scoping: per-project-tagged
  embeddingVariant: en
  noEmbeddings: false
  llmMode: smol
dev: 
  autoqaConsent: granted
hideThinkingBlock: true
task: 
  agentModelOverrides: 
    designer: anthropic/claude-opus-5
    reviewer: anthropic/opus
    task: anthropic/opus:high